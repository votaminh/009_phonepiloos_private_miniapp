<!DOCTYPE html>
<html lang="en" class="wait-launch">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-i18n="app.title">Piloos Slider</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-edit.css">
  <link rel="stylesheet" href="style-show.css">
  <link rel="stylesheet" href="style-sheets.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="style-desk.css">
  <link rel="stylesheet" href="style-insp.css">
  <link rel="stylesheet" href="nav.css">

<body>
<section class="page shell" data-page="home" id="pgHome">
  <header class="shell-top" id="homeTop"></header>
  <div class="shell-body" id="homeBody"><div class="vl" id="homeList"></div></div>
  <div class="shell-actions" id="homeActions"></div>
</section>
<section class="page shell" data-page="deck" id="pgDeck" style="display:none">
  <header class="shell-top bk-top" id="deckTop"></header>
  <nav class="dk-menu" id="dkMenu" aria-label="Menu"></nav>
  <div class="dk-tools" id="dkTools"></div>
  <div class="dstage" id="stage">
    <div class="st-scroll" id="stScroll">
    <div class="slidebox" id="slideBox">
      <canvas id="slideCv"></canvas>
      <div id="lifts"></div><div id="guides"></div><div id="msel"></div>
      <div class="frame" id="frame"></div>
    </div>
    </div>
    <div class="st-pill" id="stPill" aria-live="polite"></div>
    <div class="rd-float" id="stFloat"></div>
    <div class="rd-busy hidden" id="stBusy" role="status"></div>
  </div>
  <section class="outline" id="outline" aria-label="Outline"></section>
  <section class="quick" id="quick" aria-label="Options"></section>
  <section class="film" id="film" aria-label="Slides"></section>
  <nav class="dc-tools" id="deckTools"></nav>
  <div class="dk-notes shut" id="dkNotes"></div>
  <div class="dk-status" id="dkStatus"></div>
  <div class="fd-panel hidden" id="fdPanel"></div>
  <div class="pgs hidden" id="ovPanel"></div>
</section>
<div class="pres hidden" id="presPanel"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
