<!DOCTYPE html>
<html lang="en" class="wait-launch">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-i18n="app.title">Piloos Doc</title>
  <link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="style.css">

<body>
<section class="page shell" data-page="home" id="pgHome">
  <header class="shell-top" id="homeTop"></header>
  <div class="shell-body" id="homeBody"><div class="vl" id="homeList"></div></div>
  <div class="shell-actions" id="homeActions"></div>
</section>
<section class="page shell" data-page="doc" id="pgDoc" style="display:none">
  <header class="shell-top dc-top" id="docTop"></header>
  <div class="dc-main" id="dcMain">
    <aside class="dc-side" id="docSide" aria-label="Contents"></aside>
    <div class="shell-body dc-body" id="docBody"><div class="pw" id="pw"><article class="paper fit" id="paper"></article><div class="pgx" id="pages"></div></div><div class="pad"></div></div>
  </div>
  <div class="dc-scrim" id="sideScrim"></div>
  <div class="shell-actions tbar hidden" id="docTools"></div>
  <div class="zoom" id="zoomBox"></div>
</section>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
