<!DOCTYPE html>
<html lang="en" class="wait-launch">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-i18n="app.title">Piloos PDF</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="style-read.css">
  <link rel="stylesheet" href="style-sheets.css">
  <link rel="stylesheet" href="style-reflow.css">
  <link rel="stylesheet" href="controls.css">
  <link rel="stylesheet" href="style-desk.css">
</head>
<body>
<section class="page shell" data-page="home" id="pgHome">
  <header class="shell-top" id="homeTop"></header>
  <div class="hm-cols" id="homeCols"></div>
  <div class="shell-body" id="homeBody"><div class="vl" id="homeList"></div></div>
  <div class="shell-actions" id="homeActions"></div>
</section>
<section class="page shell" data-page="doc" id="pgDoc" style="display:none">
  <header class="shell-top bk-top" id="docTop"></header>
  <nav class="dk-menu" id="dkMenu" aria-label="Menu"></nav>
  <div class="dc-tools" id="docTools"></div>
  <div class="bk-ro hidden" id="docHint"></div>
  <aside class="dk-thumbs" id="dkThumbs" aria-label="Pages"></aside>
  <div class="rd" id="rdWrap">
    <div class="rd-scroll" id="rdScroll"><div class="vl" id="rdHost"></div></div>
    <div class="rf" id="rfScroll" data-th="light"><article class="rf-art" id="rfHost"></article></div>
    <div class="rd-pill" id="rdPill" aria-live="polite"></div>
    <div class="rd-thumb" id="rdThumb" aria-hidden="true"></div>
    <div class="rd-float" id="rdFloat"></div>
    <div class="rd-busy hidden" id="rdBusy" role="status"></div>
  </div>
  <aside class="dk-panel" id="dkPanel" aria-label="Panel"></aside>
  <div class="fd-panel hidden" id="fdPanel"></div>
  <footer class="dk-status" id="dkStatus"></footer>
  <div class="pgs hidden" id="pgsPanel"></div>
</section>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="res/colors.js"></script>
<script src="res/dimens.js"></script>
<script src="res/strings.js"></script>
<script src="sdk.js"></script>
<script src="js/i18n/i18n.js"></script>
<script src="js/models/wide-mode.js"></script>
<script src="js/views/ui.js"></script>
<script src="js/views/controls.js"></script>
<script src="js/views/popmenu.js"></script>
<script src="js/views/ui-nav.js"></script>
<script src="js/views/icons.js"></script>
<script src="js/models/store.js"></script>
<script src="js/models/pdfsvc.js"></script>
<script src="js/models/doc.js"></script>
<script src="js/models/wrap.js"></script>
<script src="js/models/paragraphs.js"></script>
<script src="js/views/home-view.js"></script>
<script src="js/views/read-view.js"></script>
<script src="js/views/pages-view.js"></script>
<script src="js/views/find-view.js"></script>
<script src="js/views/sheets-view.js"></script>

<script src="js/viewmodels/app-vm.js"></script>
<script src="js/viewmodels/motion-vm.js"></script>
<script src="js/viewmodels/read-vm.js"></script>
<script src="js/viewmodels/text-vm.js"></script>
<script src="js/viewmodels/mark-vm.js"></script>
<script src="js/viewmodels/sign-vm.js"></script>
<script src="js/viewmodels/pages-vm.js"></script>
<script src="js/viewmodels/find-vm.js"></script>
<script src="js/viewmodels/viewer-vm.js"></script>
<script src="js/viewmodels/menu-vm.js"></script>
<script src="js/viewmodels/reflow-vm.js"></script>
<script src="js/viewmodels/desk-vm.js"></script>
<script src="js/viewmodels/all-vm.js"></script>
<script src="js/viewmodels/nav-vm.js"></script>
<script src="js/viewmodels/forms-vm.js"></script>
<script src="js/viewmodels/pageops-vm.js"></script>
<script src="js/viewmodels/home-desk.js"></script>
<script src="js/viewmodels/extras-vm.js"></script>
<script src="main.js"></script>
</body>
</html>
